<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2EFE7">
<title>Franceschetta58</title>



<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

:root{
  --ink:#17213f;
  --cream:#f4f1ea;
  --paper:#fffdfa;
  --soft:#e7e3da;
  --muted:#6f746f;
  --accent:#f2c94c;
  --accent-dark:#d8aa17;
  --success:#dfe9dc;
  --warn:#efe5c7;
  --danger:#f0d8d2;
}
*{box-sizing:border-box}
html{background:var(--cream)}
body{
  margin:0;background:var(--cream);color:var(--ink);
  font-family:"DM Sans",Arial,Helvetica,sans-serif;
}
header{
  background:rgba(244,241,234,.96);
  color:var(--ink);
  padding:16px 20px;
  border-bottom:1px solid #d8d4cc;
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:16px;
  backdrop-filter:blur(10px);
}
header .brand-logo{width:min(220px,56vw);height:auto;display:block}
header .brand-fallback{
  font-family:"Space Grotesk",sans-serif;
  font-weight:700;font-size:23px;letter-spacing:-1px
}
header .header-sub{
  margin-left:auto;
  font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:700;
  color:var(--muted)
}
header p{display:none}
main{max-width:1080px;margin:auto;padding:22px 18px 100px}

.hero{
  min-height:250px;
  background:var(--paper);
  color:var(--ink);
  border:1px solid #d8d4cc;
  border-radius:22px;
  padding:32px;
  margin-bottom:18px;
  display:flex;flex-direction:column;justify-content:flex-end;
}
.hero h2{
  margin:0;
  font-family:"Space Grotesk",sans-serif;
  font-size:clamp(42px,7vw,76px);
  line-height:.92;
  letter-spacing:-.055em;
  text-transform:uppercase;
}
.hero p{
  margin:12px 0 0;color:var(--muted);
  font-weight:600;text-transform:uppercase;
  letter-spacing:.11em;font-size:11px;
}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{
  background:var(--paper);
  border:1px solid #d8d4cc;
  border-radius:18px;
  padding:18px;
  box-shadow:0 2px 12px rgba(23,33,63,.04);
}
.nav{
  cursor:pointer;min-height:138px;
  position:relative;
  display:flex;flex-direction:column;justify-content:flex-end;
  transition:transform .14s ease,border-color .14s ease,background .14s ease;
}
.nav:hover{
  transform:translateY(-2px);
  border-color:#b8b3aa;
  background:#fff
}
.nav .ico{
  font-size:24px;position:absolute;top:16px;right:16px;
  filter:none;opacity:1
}
.nav strong{
  display:block;margin:9px 0 4px;
  font-family:"Space Grotesk",sans-serif;
  font-size:20px;letter-spacing:-.035em;
  text-transform:uppercase;line-height:1
}
.nav small,.muted,small{color:var(--muted)}

button{
  border:1px solid var(--ink);
  border-radius:12px;
  background:var(--ink);
  color:#fff;
  padding:10px 14px;
  font-weight:700;
  cursor:pointer;
  text-transform:uppercase;
  letter-spacing:.06em;
  font-size:11px;
}
button:hover{opacity:.92}
button.secondary,.back{
  background:transparent;color:var(--ink);
  border-color:#bdb8ae
}
button.danger{
  background:transparent;
  color:#9f4e3b;
  border-color:#d8b2a7
}
button:disabled{opacity:.45;cursor:not-allowed}
.back{margin-bottom:16px}
.logout{
  margin-left:auto;order:3;
  background:transparent;color:var(--ink);
  border-color:#c8c3b9;
  float:none;
}

.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.list{display:grid;gap:10px}
.sectionTitle{
  margin:26px 0 12px;
  font-family:"Space Grotesk",sans-serif;
  font-size:24px;
  letter-spacing:-.04em;
  text-transform:uppercase
}
.status{
  display:inline-block;
  border:0;
  border-radius:999px;
  padding:6px 9px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
  color:var(--ink)
}
.red{background:var(--danger)}
.yellow{background:var(--warn)}
.green{background:var(--success)}
.blue{background:#e5e9ef}
.grey{background:#ece9e3}

input,select,textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid #cfcac0;
  border-radius:12px;
  background:#fff;
  color:var(--ink);
  font:inherit;
  outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--ink);
}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{
  background:transparent;
  color:var(--ink);
  border-color:#c8c3b9
}
.tab.active{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink)
}

.task{
  padding:14px;
  border-radius:14px;
  background:#fff;
  border:1px solid #dfdbd3
}
.taskmeta{
  font-size:12px;color:var(--muted);margin-top:6px
}

.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:24px;
}
.quick div{
  background:#f8f6f1;
  border:1px solid #e1ddd5;
  border-radius:14px;
  padding:14px;
  color:var(--ink)
}
.quick strong{
  display:block;
  font-family:"Space Grotesk",sans-serif;
  font-size:22px;
  letter-spacing:-.04em
}
.quick small{
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:9px
}

.loginwrap{
  max-width:440px;
  margin:42px auto;
  background:var(--paper);
  padding:26px;
  border:1px solid #d8d4cc;
  border-radius:22px;
  box-shadow:0 10px 30px rgba(23,33,63,.06)
}
.loginwrap::before{display:none}
.loginwrap h2{
  margin:0 0 22px;
  font-family:"Space Grotesk",sans-serif;
  text-transform:uppercase;
  font-size:38px;
  letter-spacing:-.05em
}
.mode{
  padding:11px 12px;
  border-radius:12px;
  margin-bottom:14px;
  background:#f7f4ee;
  border:1px solid #ddd8cf
}
.err{
  background:var(--danger);
  color:var(--ink);
  padding:10px;
  border:0;
  border-radius:12px;
  margin-top:10px;
  display:none
}

.mealday{
  display:grid;
  grid-template-columns:100px 1fr 1fr;
  gap:10px
}
.mealbox{
  background:#f8f6f1;
  border:1px solid #e0dcd3;
  border-radius:14px;
  padding:13px
}
.dayrow{display:grid;grid-template-columns:120px 1fr;gap:12px}
.shift{
  padding:11px;
  border-radius:12px;
  background:#f8f6f1;
  border:1px solid #e0dcd3;
  margin-bottom:7px
}
.low{border-left:5px solid var(--accent)}
.ok{border-left:5px solid #9eb095}
.kpi{
  font-family:"Space Grotesk",sans-serif;
  font-size:34px;
  font-weight:700;
  letter-spacing:-.05em
}
.notice{
  background:#f8f6f1;
  border:1px solid #d8d4cc
}
.eventCard{border-left:5px solid var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

#prepRoot>.card:first-child,
#shiftRoot>.card:first-child,
#eventRoot>.card:first-child,
#inventoryRoot>.card:first-child,
#mealRoot>.card:first-child{
  background:var(--paper);
  padding:24px
}
#prepRoot>.card:first-child h2,
#shiftRoot>.card:first-child h2,
#eventRoot>.card:first-child h2,
#inventoryRoot>.card:first-child h2,
#mealRoot>.card:first-child h2{
  margin:0 0 8px;
  font-family:"Space Grotesk",sans-serif;
  font-size:clamp(32px,6vw,54px);
  letter-spacing:-.05em;
  text-transform:uppercase;
  line-height:.95
}

.card h2,.card h3{
  font-family:"Space Grotesk",sans-serif;
  letter-spacing:-.035em
}
.card hr{
  border:0;border-top:1px solid #ddd8cf
}

@media(min-width:760px){
  .grid{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:650px){
  header{padding:14px}
  header .header-sub{display:none}
  main{padding:14px 12px 85px}
  .hero{min-height:240px;padding:24px}
  .quick{grid-template-columns:1fr 1fr}
  .formgrid,.mealday,.dayrow{grid-template-columns:1fr}
  .full{grid-column:auto}
  .grid{grid-template-columns:1fr 1fr}
  .nav{min-height:128px}
}

.monthToolbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:18px 0 12px
}
.monthToolbar h3{
  margin:0;font-family:"Space Grotesk",sans-serif;
  font-size:28px;text-transform:uppercase;letter-spacing:-.045em
}
.calendarWrap{
  overflow-x:auto;
  border:1px solid #d8d4cc;
  border-radius:18px;
  background:var(--paper)
}
.monthGrid{
  min-width:820px;
  display:grid;
  grid-template-columns:repeat(7,1fr);
}
.weekday{
  padding:11px 8px;
  font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);
  border-bottom:1px solid #ddd8cf;
  background:#f8f6f1
}
.dayCell{
  min-height:145px;
  padding:10px;
  border-right:1px solid #e3dfd7;
  border-bottom:1px solid #e3dfd7;
  background:#fff
}
.dayCell:nth-child(7n){border-right:0}
.dayCell.empty{background:#f6f3ed}
.dayHead{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px
}
.dayNum{
  font-family:"Space Grotesk",sans-serif;
  font-size:18px;font-weight:700
}
.todayDot{
  width:7px;height:7px;border-radius:50%;background:var(--accent)
}
.offGroup{margin-top:7px}
.offLabel{
  font-size:9px;font-weight:800;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted);margin-bottom:3px
}
.personChip{
  display:inline-block;
  margin:2px 3px 2px 0;
  padding:4px 7px;
  border-radius:999px;
  font-size:10px;font-weight:700;
  background:#ece9e3;color:var(--ink)
}
.personChip.full{background:#dedbd4}
.personChip.am{background:#eee6d1}
.personChip.pm{background:#e4e8ec}
.calendarLegend{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:12px
}
.calendarLegend span{
  font-size:11px;padding:6px 8px;border-radius:999px
}

.personChip.full{background:#f0d8d2}
.personChip.am{background:#efe5c7}
.personChip.pm{background:#dfe6f0}
.photoImportBox{
  margin-top:14px;padding:16px;border:1px dashed #c8c3b9;border-radius:14px;background:#fbfaf6
}
.photoPreviewWrap{
  margin-top:12px;border:1px solid #ddd8cf;border-radius:14px;padding:10px;background:#fff
}
.photoPreviewWrap img{
  width:100%;max-height:260px;object-fit:contain;border-radius:10px
}
.importHint{
  font-size:12px;color:var(--muted);margin-top:8px
}
.importSuccess{
  background:#e7f0e4;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:12px
}

.mobileCalendarHint{
  display:none;color:var(--muted);font-size:11px;margin:8px 0 0
}
@media(max-width:650px){
  .monthToolbar h3{font-size:23px}
  .mobileCalendarHint{display:block}
}


.smartPlan{
  margin-top:12px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px
}
.smartPlan>div{
  background:#f8f6f1;
  border:1px solid #e0dcd3;
  border-radius:12px;
  padding:10px
}
.smartPlan small{
  display:block;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.07em;
  margin-bottom:4px
}
.smartPlan strong{
  font-family:"Space Grotesk",sans-serif;
  font-size:18px
}
.productionNeed{
  border-left:5px solid var(--accent)
}
.productionOk{
  border-left:5px solid #9eb095
}
.autoPrepCard{
  background:#fff;
  border:1px solid #d8d4cc;
  border-radius:16px;
  padding:15px
}
.autoPrepQty{
  font-family:"Space Grotesk",sans-serif;
  font-size:30px;
  letter-spacing:-.05em;
  font-weight:700
}
.planInputs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px
}
.planInputs label{
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--muted)
}
.planInputs input{margin-top:4px}
@media(max-width:650px){
  .smartPlan{grid-template-columns:1fr 1fr}
  .planInputs{grid-template-columns:1fr}
}


.todoHome{margin:0 0 18px;background:#fff;border:1px solid #d8d4cc;border-radius:18px;padding:18px}
.todoHome h3{margin:0 0 6px;font-family:"Space Grotesk",sans-serif;font-size:30px;letter-spacing:-.04em;text-transform:uppercase}
.todoHome .task{background:#faf8f3}
.categoryTabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.categoryTabs button{background:transparent;color:var(--ink);border-color:#c8c3b9}
.categoryTabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.quickAdd{display:grid;grid-template-columns:2fr .8fr .8fr auto;gap:8px;align-items:end}
.eventBox{margin-top:18px;background:#fbfaf6;border:1px solid #ddd8cf;border-radius:16px;padding:16px}
.eventNeedRow{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;align-items:end;margin-top:10px}
.supplierGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.supplierCard{background:#fff;border:1px solid #d8d4cc;border-radius:16px;padding:16px}
.supplierCard h3{margin:0 0 10px;font-family:"Space Grotesk",sans-serif;text-transform:uppercase;letter-spacing:-.035em}
.orderLine{padding:10px 0;border-top:1px solid #ece8df}
.orderLine:first-of-type{border-top:0}
.orderMeta{font-size:11px;color:var(--muted);margin-top:3px}
.dailyBar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:14px 0}
@media(max-width:650px){
  .quickAdd,.eventNeedRow{grid-template-columns:1fr}
  .supplierGrid{grid-template-columns:1fr}
}


/* V9.2 */
.todayDate{font-size:13px;font-weight:700;text-transform:capitalize;color:var(--muted);margin:3px 0 14px}
.weekPlanner{display:grid;grid-template-columns:repeat(7,minmax(145px,1fr));gap:9px;min-width:1080px}
.weekWrap{overflow-x:auto;padding-bottom:6px}
.weekDay{background:var(--paper);border:1px solid #d8d4cc;border-radius:16px;padding:12px;min-height:220px}
.weekDay.today{outline:2px solid var(--ink)}
.weekDay.closed{background:#ece9e3;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.weekDay h4{font-family:"Space Grotesk",sans-serif;margin:0 0 10px;text-transform:uppercase;font-size:15px}
.weekDate{font-size:11px;color:var(--muted);margin-bottom:10px}
.weekItem{border-top:1px solid #ece8df;padding:9px 0}
.weekItem:first-of-type{border-top:0}
.weekItem.done{opacity:.55;text-decoration:line-through}
.gearCard{border-left:5px solid #8396b3}
.gearLine{padding:10px 0;border-top:1px solid #ece8df}.gearLine:first-child{border-top:0}
.spinBox{text-align:center;padding:28px 18px}
.spinName{font-family:"Space Grotesk",sans-serif;font-size:42px;letter-spacing:-.05em;margin:14px 0}
.spinWheel{width:150px;height:150px;border:10px solid #e2ded6;border-top-color:var(--ink);border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:46px}
.spinHistory{display:grid;gap:8px;margin-top:12px}
.shiftLong{white-space:normal;line-height:1.15;display:block;margin:4px 0;padding:6px 7px}
@media(max-width:650px){
 .spinName{font-size:34px}
}


/* V9.3 */
.todoQuickAdd{display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0 14px}
.todoQuickAdd input{min-width:0}
.waBar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid #ece8df}
.waBar select{max-width:150px}
.waBtn{background:#244b32;border-color:#244b32}
.contactSetup{margin-top:12px;background:#f8f6f1;border:1px solid #e0dcd3;border-radius:14px;padding:12px}
.contactSetup summary{cursor:pointer;font-weight:700}
.supplierHead{display:flex;align-items:center;justify-content:space-between;gap:10px}
@media(max-width:650px){
 .todoQuickAdd{grid-template-columns:1fr}
 .waBar select{max-width:none}
}


/* V9.5 */
.mealWeek{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:10px;min-width:1100px}
.mealWeekWrap{overflow-x:auto;padding-bottom:5px}
.mealDayCard{background:var(--paper);border:1px solid #d8d4cc;border-radius:16px;padding:13px}
.mealDayCard h4{font-family:"Space Grotesk",sans-serif;text-transform:uppercase;margin:0 0 3px}
.mealField{margin-top:10px}
.mealField label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted)}
.ideaCard{border-left:5px solid #9a7b52}
.ideaDish{font-family:"Space Grotesk",sans-serif;font-size:25px;letter-spacing:-.04em;margin:5px 0}
.recipeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.recipeCard{background:var(--paper);border:1px solid #d8d4cc;border-radius:16px;padding:16px}
.recipeCard h3{font-family:"Space Grotesk",sans-serif;margin:0 0 6px}
.tagRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.miniTag{display:inline-block;border:1px solid #d8d4cc;border-radius:999px;padding:4px 7px;font-size:10px;background:#f8f6f1}
.menuImport{border:1px dashed #bdb7ad;border-radius:16px;padding:16px;background:#fbfaf6}
.menuImport img{width:100%;max-height:260px;object-fit:contain;border-radius:12px;margin-top:10px}
.easterEgg{
 position:fixed;right:18px;bottom:18px;z-index:50;
 width:58px;height:58px;border-radius:50%;padding:0;font-size:29px;
 box-shadow:0 8px 25px rgba(23,33,63,.22);
 background:var(--paper);color:var(--ink);border:2px solid var(--ink)
}
.eggOverlay{position:fixed;inset:0;background:rgba(16,23,44,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
.eggModal{width:min(520px,100%);background:var(--paper);border-radius:22px;padding:22px;border:1px solid #d8d4cc;box-shadow:0 20px 80px rgba(0,0,0,.25)}
.eggIcon{font-size:56px;margin-bottom:8px}
.eggModal h2{font-family:"Space Grotesk",sans-serif;text-transform:uppercase;letter-spacing:-.04em;margin:0 0 8px}
.photoStatus{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:650px){
 .recipeGrid{grid-template-columns:1fr}
 .easterEgg{width:54px;height:54px;font-size:26px}
}


/* V9.8 */
.hero{position:relative}
.dashPersonalize{position:absolute;top:18px;right:18px}
.dashboardGrid .nav{min-height:158px;display:grid;grid-template-rows:auto 1fr auto auto;justify-content:stretch;padding:16px;overflow:hidden}
.dashboardGrid .nav .ico{position:static;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #ddd8cf;border-radius:13px;background:#f7f4ee;font-size:25px;margin:0}
.dashboardGrid .nav .navSpacer{min-height:12px}
.dashboardGrid .nav strong{min-height:44px;margin:0 0 5px;display:flex;align-items:flex-end;line-height:1.05;font-size:18px}
.dashboardGrid .nav small{min-height:30px;display:block;line-height:1.25}
.dashboardGrid.editing .nav{border-style:dashed;cursor:grab;background:#fbfaf6}
.dashboardGrid.editing .nav:active{cursor:grabbing}
.dashMove{position:absolute;top:9px;right:9px;display:flex;gap:4px}
.dashMove button{width:30px;height:30px;padding:0;background:var(--paper);color:var(--ink);border-color:#c8c3b9;font-size:14px}
.dashboardEditBar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.ideaFeed{display:grid;gap:10px}
.ideaPost{border-left:5px solid #9aa7b8}
.ideaPost.feedback{border-left-color:#9f8a60}
.ideaPost.test{border-left-color:#879d7c}
.ideaType{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ideaText{white-space:pre-wrap;line-height:1.5;margin:8px 0}
.voiceField{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}

}

   stopRealtime();
   if(!u){currentUser=null;currentProfile=null;showLogin();return}
   try{
    const snap=await db.collection("users").doc(u.uid).get();
    if(!snap.exists || !["admin","user","intern"].includes(snap.data().role) || snap.data().disabled===true){
     await auth.signOut();showLogin("Profilo non abilitato. Contatta Tommy o Vins.");return;

}

 {title:"Le infinite peripezie del tortellino",meta:"Ricette Storiche • storia emiliana",intro:"Il tortellino moderno è il risultato di secoli di trasformazioni. Le prime versioni conosciute sono molto lontane dal ripieno che oggi consideriamo classico.",ingredients:["Per circa 3 kg: lombo di maiale 300 g","Prosciutto crudo 300 g","Mortadella di Bologna 300 g","Parmigiano Reggiano 450 g","Uova 3","Noce moscata 1","Sfoglia: farina 00 1,2 kg","Uova intere 12","Sale 1 presa"],body:["Nel 1501 compaiono tortelli bolognesi con ripieni di formaggio, uova, spezie e perfino uva passa; alcune versioni venivano fritte e servite con zucchero. Nei secoli successivi il ripieno si stabilizza maggiormente attorno a pollo o cappone, midollo, parmigiano, uova e spezie.","La carne di maiale entra relativamente tardi. La ricetta di Pellegrino Artusi del 1891 è uno snodo importante, mentre la formula depositata a Bologna nel 1974 sostituisce il midollo con il lombo. Anche la forma è cambiata: per molto tempo si usarono dischi di sfoglia, mentre il quadrato è diventato comune molto più tardi."],steps:["Tritare lombo rosolato e salumi, poi unire parmigiano, uova e noce moscata.","Far riposare il ripieno in frigorifero.","Preparare una sfoglia molto sottile.","Tagliare quadrati di 3–4 cm, farcire, chiudere e unire le punte.","Cuocere in brodo di manzo e gallina o cappone."],note:"La tradizione è fortissima, ma non è mai stata immobile."},

 {title:"Cannelloni: da moda nazionale a terreno di sperimentazione",meta:"Ricette Storiche • Bologna e Novecento",intro:"Negli anni Sessanta e Settanta i cannelloni erano quasi inevitabili nei ristoranti italiani, ma la loro forma moderna è molto più recente di ravioli e lasagne.",ingredients:["Vitello macinato 500 g","Sedano 1 costa, carota 1, cipolla piccola 1","Olio EVO 3 cucchiai","Vino bianco 1 bicchiere","Besciamella: latte 1 L, farina 50 g, burro 50 g","Ricotta vaccina 500 g","Parmigiano 100 g","Sfoglia: farina 300 g, uova 3","Ragù bolognese e parmigiano per finire"],body:["Nel Seicento esistevano già preparazioni chiamate cannelloni, ma potevano essere dolci fritti o involtini di carne. Nell'Ottocento compaiono paste ripiene più vicine al concetto moderno; nel 1910 si trovano ricette denominate cannelloni alla bolognese e alla siciliana.","La versione del ristorante Al Pappagallo di Bologna usa una farcia di ragù magro di vitello, ricotta, parmigiano e parte della besciamella. La sfoglia viene sbollentata, farcita, arrotolata e gratinata con altra besciamella, ragù e parmigiano."],steps:["Cuocere il ragù di vitello con verdure, vino ed erbe finché asciutto.","Preparare la besciamella e mescolarne una parte con ragù, ricotta e parmigiano.","Preparare e sbollentare la sfoglia.","Farcire e arrotolare.","Gratinare a circa 200 °C per una quindicina di minuti."],note:"La struttura è perfetta per prove creative perché la farcia può cambiare radicalmente."},
 {title:"Nocino: Modena, San Giovanni e un'origine francese",meta:"Ricette Storiche • storia modenese",intro:"Il nocino è fortemente legato a Modena, ma la sua genealogia passa anche dai ratafià di noci francesi del Settecento.",ingredients:["Noci verdi non trattate 12","Grappa o brandy poco invecchiato 2 L","Zucchero 370 g","Acqua 340 cl","Cannella 1 pezzo","Semi di coriandolo 5–10"],body:["Le noci acerbe erano usate da secoli sia in cucina sia nella medicina tradizionale. Nel Cinquecento si trovano conserve di noci con zucchero o miele e spezie; nel 1760 compare in Francia un ratafià di noci, poi diffuso anche in Italia. Il nome nocino si afferma invece molto più tardi, all'inizio del Novecento.","La preparazione sfrutta noci ancora tenere, con il guscio non lignificato. L'infusione alcolica dura settimane; in seguito si aggiungono sciroppo e spezie, poi si lascia riposare di nuovo prima di filtrare e imbottigliare."],steps:["Tagliare a metà le noci e metterle nel vaso con grappa o brandy.","Lasciare al fresco e al buio per circa 6 settimane, muovendo ogni tanto il vaso.","Filtrare e unire acqua e zucchero sciolti e raffreddati.","Aggiungere cannella e coriandolo e lasciare riposare ancora circa un mese.","Filtrare nuovamente e imbottigliare."],note:"Perfetta per Franceschetta: modenese nell'identità, ma con una storia molto internazionale."},

function dailyEggContent(){
 const day=daySerial();
 const isGZ=day%2===0;
 const pool=isGZ?DAILY_GZ:DAILY_HISTORY;
 // Advance independently through each source, so alternating days don't repeat immediately.
 const idx=Math.floor(day/2)%pool.length;
 const x=pool[idx];
 return {
   ...x,
   kind:isGZ?"Ricetta del giorno":"Ricetta storica / curiosità",
   source:isGZ?"GialloZafferano":"Ricette Storiche"
 };
}

function defaultDashboardOrder(){

 order=order.filter(k=>sections[k]);
 defaultDashboardOrder().forEach(k=>{

function saveDashboardOrder(order){

}

function moveDashboardCard(key,delta){
 const order=getDashboardOrder();
 const i=order.indexOf(key);
 const j=i+delta;
 if(i<0||j<0||j>=order.length)return;
 [order[i],order[j]]=[order[j],order[i]];
 saveDashboardOrder(order);
 home();
}
function resetDashboardOrder(){

 home();
}
function dashDragStart(ev,key){
 if(!dashboardEditMode){
   ev.preventDefault();
   return;
 }
 dashboardDragKey=key;
 try{ev.dataTransfer.setData("text/plain",key)}catch(e){}
}
function dashDrop(ev,target){
 if(!dashboardEditMode)return;
 ev.preventDefault();
 const source=dashboardDragKey||ev.dataTransfer?.getData("text/plain");
 if(!source||source===target)return;
 const order=getDashboardOrder();
 const from=order.indexOf(source);
 const to=order.indexOf(target);
 if(from<0||to<0)return;
 order.splice(from,1);
 order.splice(to,0,source);
 saveDashboardOrder(order);
 dashboardDragKey=null;
 home();
}

   <div class="ico">${v[0]}</div>

   </div>`:""}
 </div>`;
}


function stampMs(v){
 if(!v)return 0;
 if(typeof v==="number")return v;
 if(v?.toMillis)return v.toMillis();
 if(v?.seconds)return v.seconds*1000;
 const n=Number(v);return Number.isFinite(n)?n:0;
}

function globalSearchData(q){
 q=String(q||"").trim().toLowerCase();if(q.length<2)return [];
 const hit=(v)=>String(v??"").toLowerCase().includes(q);
 const res=[];
 tasks.forEach(x=>{if(hit(x.text)||hit(x.partita))res.push({type:"TO DO / Preparazione",title:x.text,sub:x.partita||"",target:"prep"})});
 menuRecipes.forEach(x=>{if(hit(x.name)||hit((x.ingredients||[]).join(" "))||hit(x.recipe))res.push({type:"Ricetta",title:x.name,sub:(x.ingredients||[]).slice(0,5).join(", "),target:"ricette"})});
 inventory.forEach(x=>{if(hit(x.name)||hit(x.location)||hit(x.station)||hit(x.category))res.push({type:"Magazzino",title:x.name,sub:`${x.qty||0} ${x.unit||""} • ${x.location||""}`,target:"magazzino"})});
 orders.forEach(x=>{if(hit(x.item)||hit(x.supplier))res.push({type:"Ordine",title:x.item,sub:`${x.supplier} • ${fmtDate(x.deliveryDate)}`,target:"fornitori"})});
 events.forEach(x=>{if(hit(x.name)||hit(x.note))res.push({type:x.type==="buyout"?"Buyout":"Evento",title:x.name,sub:`${fmtDate(x.date)} • ${x.covers||0} coperti`,target:"eventi"})});
 menuIdeas.forEach(x=>{if(hit(x.title)||hit(x.text))res.push({type:"Menu & Idee",title:x.title||"Idea",sub:x.text||"",target:"menu"})});
 teamProfiles.forEach(x=>{if(hit(x.name)||hit(x.station)||hit(x.favoriteDish)||hit(x.hatedIngredient))res.push({type:"Personale",title:x.name,sub:x.station||"",target:"personale"})});
 meals.forEach(x=>{if(hit(x.lunch)||hit(x.dinner))res.push({type:"Staff Meal",title:fmtDate(x.date),sub:[x.lunch,x.dinner].filter(Boolean).join(" • "),target:"staffmeal"})});
 return res.slice(0,40);
}

function ingredientAllergens(ingredients){
 const text=(ingredients||[]).join(" ").toLowerCase();
 const rules=[
  ["Glutine",["farina","frumento","grano","semola","pasta","pane","pangrattato","orzo","segale","avena","farro"]],
  ["Crostacei",["gamber","scamp","aragost","astice","granch"]],
  ["Uova",["uovo","uova","tuorlo","albume","maionese"]],
  ["Pesce",["pesce","acciuga","aringa","tonno","salmone","cefalo","baccal","merluzzo","spada"]],
  ["Arachidi",["arachid"]],
  ["Soia",["soia","miso","tofu","edamame"]],
  ["Latte",["latte","burro","panna","formaggio","parmigiano","grana","ricotta","mascarpone","yogurt","mozzarella"]],
  ["Frutta a guscio",["nocciol","mandorl","noce","noci","pistac","anacard","pecan"]],
  ["Sedano",["sedano"]],
  ["Senape",["senape"]],
  ["Sesamo",["sesamo"]],
  ["Solfiti",["solfiti","vino","aceto balsamico"]],
  ["Lupini",["lupin"]],
  ["Molluschi",["vongol","cozza","polpo","seppia","calamar","ostrica","lumaca"]]
 ];
 return rules.filter(([_,keys])=>keys.some(k=>text.includes(k))).map(x=>x[0]);
}
function recipeAllergens(r){
 const auto=ingredientAllergens(r.ingredients||[]);
 const manual=Array.isArray(r.manualAllergens)?r.manualAllergens:[];
 return [...new Set([...auto,...manual])];
}

function nextEvent(){const now=new Date(),future=events.filter(e=>new Date(`${e.date}T${e.time||"00:00"}`)>=now).sort((a,b)=>new Date(`${a.date}T${a.time||"00:00"}`)-new Date(`${b.date}T${b.time||"00:00"}`));return future[0]||null}
function countdownText(e){const diff=new Date(`${e.date}T${e.time||"00:00"}`)-new Date();if(diff<=0)return "OGGI";const days=Math.floor(diff/86400000),hrs=Math.floor((diff%86400000)/3600000);return days>0?`${days}g ${hrs}h`:`${hrs}h`}

function weeklyPlanPage(){
 setPage("programmazione");
 app.innerHTML=`<button class="back" onclick="home()">← IN CUCINA</button><div id="weeklyRoot"></div>`;

function changeWeek(n){weekCursor=addDays(weekCursor,n*7);renderWeeklyPlan()}
function renderWeeklyPlan(){
 const days=[0,1,2,3,4,5,6].map(n=>addDays(weekCursor,n));
 const tk=todayKey();
 weeklyRoot.innerHTML=`<div class="card"><h2>Programmazione settimanale</h2><p class="muted">La sera decidete insieme cosa produrre nei giorni successivi. La domenica è chiusa.</p></div>
 <div class="monthToolbar"><button class="secondary" onclick="changeWeek(-1)">← Settimana prima</button><h3>${weekRangeLabel()}</h3><button class="secondary" onclick="changeWeek(1)">Settimana dopo →</button></div>
 ${canStaff()?`<div class="card"><strong>Aggiungi alla settimana</strong><div class="formgrid" style="margin-top:10px"><div><input id="wpDate" type="date" value="${localDateKey(days[0])}"></div><div class="full"><input id="wpText" placeholder="Es. fare savoiardi / pelare patate / fare terrina"></div><div><button onclick="addWeeklyItem()">Aggiungi</button></div></div></div>`:""}
 <div class="weekWrap" style="margin-top:12px"><div class="weekPlanner">
   ${days.map((d,i)=>{
      const key=localDateKey(d),isSunday=i===6,rows=weeklyPlan.filter(w=>w.date===key);
      if(isSunday)return `<div class="weekDay closed"><h4>Domenica</h4><div class="weekDate">${shortDateIT(d)}</div><strong>CHIUSO</strong><small>Nessuna programmazione</small></div>`;
      return `<div class="weekDay ${key===tk?"today":""}"><h4>${d.toLocaleDateString("it-IT",{weekday:"long"})}</h4><div class="weekDate">${shortDateIT(d)}</div>
        ${rows.map(w=>`<div class="weekItem ${w.done?"done":""}"><strong>${w.text}</strong><div class="taskmeta">da ${w.author||"?"}</div><div class="actions"><button class="${w.done?"secondary":"good"}" onclick="toggleWeeklyItem('${w.id}')">${w.done?"Riapri":"Fatto"}</button>${canStaff()?`<button class="danger" onclick="deleteWeeklyItem('${w.id}')">×</button>`:""}</div></div>`).join("")||'<div class="muted">—</div>'}
      </div>`;
   }).join("")}
 </div></div>`;
}
async function addWeeklyItem(){
 if(!canStaff())return;
 const date=wpDate.value,text=wpText.value.trim();if(!date||!text)return alert("Inserisci giorno e attività.");
 const d=new Date(date+"T12:00:00");if(d.getDay()===0)return alert("La domenica Franceschetta è chiusa.");
 const data={date,text,done:false,author:currentProfile.name,authorUid:currentUser.uid,createdAt:ts(),updatedAt:ts()};
 if(onlineMode)await db.collection("weeklyPlan").add(data);else{weeklyPlan.push({id:"w"+Date.now(),...data});saveDemo();renderWeeklyPlan()}
}
async function toggleWeeklyItem(id){
 const w=weeklyPlan.find(x=>x.id===id);if(!w)return;
 const patch={done:!w.done,completedBy:!w.done?currentProfile.name:"",updatedAt:ts()};
 if(onlineMode)await db.collection("weeklyPlan").doc(id).update(patch);else{Object.assign(w,patch);saveDemo();refreshCurrent()}
}
async function deleteWeeklyItem(id){
 if(!canStaff())return;

function renderPantry(){const rows=inventory.filter(x=>x.kind==="pantry"&&x.category===pantryCat);return `<div class="subTabs">${PANTRY_CATS.map(c=>`<button class="${pantryCat===c?"active":""}" onclick="pantryCat='${c}';renderInventory()">${c}</button>`).join("")}</div>${canStaff()?`<div class="card"><strong>Aggiunta rapida — ${pantryCat}</strong><div class="quickAdd" style="margin-top:10px"><input id="pnName" placeholder="Ingrediente"><input id="pnQty" type="number" step="0.1" placeholder="Qtà"><select id="pnUnit">${unitOptions()}</select><input id="pnLoc" value="Dispensa" placeholder="Dove"><button onclick="addStock('pantry')">+</button></div></div>`:""}<h3 class="sectionTitle">${pantryCat}</h3><p class="muted">Pallino rosso quando resta 1 unità o meno.</p><div class="list">${rows.map(stockRow).join("")||'<div class="card muted">Nessun prodotto.</div>'}</div>`}

 return `<div class="card stockRow ${lowStock(x)?"low":""} ${x.useSoon?"useSoon":""}">

function normalizeWhatsAppNumber(v){
 return String(v||"").replace(/[^\d]/g,"");
}
function saveWhatsAppContacts(){
 whatsappContacts={
   Vins:normalizeWhatsAppNumber(document.getElementById("waVins")?.value),
   Tommy:normalizeWhatsAppNumber(document.getElementById("waTommy")?.value)
 };
 localStorage.setItem("f58v93_whatsapp",JSON.stringify(whatsappContacts));localStorage.setItem("f58v95_recipes",JSON.stringify(menuRecipes));localStorage.setItem("f58v98_menuideas",JSON.stringify(menuIdeas));localStorage.setItem("f58v10_team",JSON.stringify(teamProfiles));
 alert("Contatti WhatsApp salvati su questo dispositivo.");
 renderSuppliers();
}
function supplierOrderMessage(supplier){
 const rows=orders.filter(o=>o.deliveryDate===orderDateCursor&&o.supplier===supplier);
 if(!rows.length)return "";
 const date=fullDateIT(orderDateCursor);
 const lines=rows.map(o=>`• ${o.item}${num(o.qty)>0?` — ${o.qty} ${o.unit||""}`:""}`);
 return `ORDINE ${supplier.toUpperCase()}\nPer ${date}\n\n${lines.join("\n")}`;
}
function sendSupplierWhatsApp(supplier){
 const msg=supplierOrderMessage(supplier);
 if(!msg)return alert("Non c'è niente da inviare per questo fornitore.");
 const sel=document.getElementById("waTo_"+supplier);
 const recipient=sel?.value||"Vins";
 const number=normalizeWhatsAppNumber(whatsappContacts[recipient]);
 const url=number?`https://wa.me/${number}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`;
 if(!number)showToast(`Numero di ${recipient} non configurato: scegli il contatto in WhatsApp.`);
 window.open(url,"_blank");
}
async function markSupplierOrderSent(supplier){
 const rows=orders.filter(o=>o.deliveryDate===orderDateCursor&&o.supplier===supplier);
 if(!rows.length)return;
 const patch={sentAt:ts(),sentBy:currentProfile.name};
 if(onlineMode){
   const batch=db.batch();rows.forEach(o=>batch.update(db.collection("orders").doc(o.id),patch));await batch.commit();
 }else{
   rows.forEach(o=>Object.assign(o,{sentAt:Date.now(),sentBy:currentProfile.name}));saveDemo();renderSuppliers();updateNotificationBadge();
 }
 showToast(`Ordine ${supplier} segnato come inviato.`);
}
function orderBatchGroups(){
 const map=new Map();
 orders.forEach(o=>{
   const key=`${o.deliveryDate}|${o.supplier}`;
   if(!map.has(key))map.set(key,{date:o.deliveryDate,supplier:o.supplier,rows:[]});
   map.get(key).rows.push(o);
 });
 return [...map.values()].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}
function orderHistoryHtml(){
 const groups=orderBatchGroups().filter(g=>g.rows.some(x=>x.sentAt)).slice(0,40);
 return `<div class="card"><div class="row"><div><h2 style="margin:0">Storico ordini</h2><div class="muted">Ordini confermati come inviati.</div></div><button class="secondary" onclick="orderHistoryMode=false;renderSuppliers()">Torna agli ordini</button></div></div>
 <div class="list" style="margin-top:12px">${groups.map(g=>{const sent=g.rows.find(x=>x.sentAt);return `<div class="card orderHistoryCard"><div class="row"><div><strong>${escapeHtml(g.supplier)}</strong><div class="muted">${fmtDate(g.date)}</div></div><div class="sentStamp">Inviato da ${escapeHtml(sent?.sentBy||"?")}</div></div><div style="margin-top:8px">${g.rows.map(x=>`<div class="orderLine"><div class="row"><span>${escapeHtml(x.item)}</span><strong>${x.qty||""} ${escapeHtml(x.unit||"")}</strong></div></div>`).join("")}</div></div>`}).join("")||'<div class="card muted">Nessun ordine inviato ancora.</div>'}</div>`;
}

function changeMealWeek(n){mealWeekCursor=addDays(mealWeekCursor,n*7);renderMeals()}
function mealForDate(date){return meals.find(m=>m.date===date)}
function mealDays(){return [0,1,2,3,4,5].map(i=>addDays(mealWeekCursor,i))}
function scrapsFromMenu(){
 const out=[];menuRecipes.forEach(r=>(r.scraps||[]).forEach(s=>{if(s&&!out.some(x=>x.toLowerCase()===s.toLowerCase()))out.push(s)}));return out;
}
function ingredientsFromMenu(){
 const out=[];menuRecipes.forEach(r=>(r.ingredients||[]).forEach(s=>{if(s&&!out.some(x=>x.toLowerCase()===s.toLowerCase()))out.push(s)}));return out;
}
function warehouseMealCandidates(){return inventory.filter(x=>x.useSoon&&num(x.qty)>0).map(x=>x.name)}
function buildMealIdea(){
 const scraps=scrapsFromMenu(),warehouse=warehouseMealCandidates(),ingredients=ingredientsFromMenu();
 const sourcePool=[...warehouse,...scraps,...ingredients];
 let key=sourcePool.length?sourcePool[hashText(todayKey()+currentProfile.name+Date.now())%sourcePool.length]:"";
 const low=key.toLowerCase();let dish="",why="";
 if(low.includes("faraona")){dish="Faraona in umido con piselli";why="Usa ritagli o scorte di faraona in una preparazione semplice."}
 else if(low.includes("parmigiano")||low.includes("croste")){dish="Minestra di legumi con croste di Parmigiano";why="Le croste danno sapore a una minestra semplice."}
 else if(low.includes("patat")){dish="Frittata di patate e cipolla";why="Funziona bene con ritagli o patate da utilizzare."}
 else if(low.includes("pane")){dish="Pappa al pomodoro";why="Recupero semplice del pane con ingredienti di base."}
 else if(low.includes("pesce")||low.includes("cefalo")){dish="Polpette di pesce con patate";why="Ritagli cotti di pesce possono diventare un impasto semplice."}
 else if(low.includes("zucch")||low.includes("melanz")||low.includes("peper")||low.includes("verd")){dish="Frittata di verdure e ritagli";why="Assorbe bene piccole quantità di verdure."}
 else if(low.includes("riso")){dish="Riso saltato con verdure e uovo";why="Piatto rapido per usare riso e piccole rimanenze."}
 else if(low.includes("legum")||low.includes("ceci")||low.includes("fagiol")||low.includes("lentic")){dish="Zuppa di legumi con crostini";why="Staff meal economico e facile da produrre in quantità."}
 else if(low){dish=`Teglia rustica con ${key}`;why="Idea semplice costruita a partire da una disponibilità reale della cucina."}
 else{
   const season=currentSeason();
   dish={autunno:"Vellutata di zucca e patate",inverno:"Zuppa di cavolo e legumi",primavera:"Riso con piselli ed erbe",estate:"Pasta al pomodoro e verdure"}[season];
   key=season;why="Idea stagionale semplice.";
 }
 generatedMealIdea={dish,source:key,why,fromWarehouse:warehouse.some(x=>x===key)};
 renderMeals();
}

async function persistMealEntry(date,slot,text){

   try{
     if(existing){
       await db.collection("staffMeals").doc(existing.id).update({[slot]:text,updatedBy:currentProfile.name,updatedAt:now});
       existing[slot]=text;existing.updatedBy=currentProfile.name;existing.updatedAt=now;
     }else{
       const data={date,lunch:"",dinner:"",author:currentProfile.name,authorUid:currentUser.uid,createdAt:now,updatedBy:currentProfile.name,updatedAt:now};
       data[slot]=text;
       const ref=await db.collection("staffMeals").add(data);
       meals.push({id:ref.id,...data});
     }
   }catch(e){
     console.error(e);
     alert("Non sono riuscito a salvare lo Staff Meal. Riprova.");
     return false;
   }
 }else{
   if(existing){
     existing[slot]=text;existing.updatedBy=currentProfile.name;existing.updatedAt=Date.now();
   }else{
     const data={id:"m"+Date.now(),date,lunch:"",dinner:"",author:currentProfile.name,authorUid:currentUser.uid,createdAt:Date.now(),updatedBy:currentProfile.name,updatedAt:Date.now()};

   }

 }

}

let activeRecognition=null;
function startDictation(targetId,button){
 const target=document.getElementById(targetId);if(!target)return;
 target.focus();
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
   showToast("Qui la dettatura diretta non è disponibile: usa il 🎙️ della tastiera Android nel campo appena aperto.",4200);
   return;
 }
 if(activeRecognition){try{activeRecognition.stop()}catch(e){}activeRecognition=null}
 const rec=new SR();activeRecognition=rec;rec.lang="it-IT";rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=1;
 const original=button?.textContent||"🎙️ Detta";
 if(button){button.textContent="🔴 Ascolto…";button.classList.add("listening")}
 const base=target.value.trim();let finalText="";
 rec.onresult=e=>{
   let interim="";
   for(let i=e.resultIndex;i<e.results.length;i++){
     const t=e.results[i][0].transcript;
     if(e.results[i].isFinal)finalText+=t+" ";else interim+=t;
   }
   target.value=(base+(base?" ":"")+finalText+interim).trimStart();
 };
 const finish=()=>{activeRecognition=null;if(button){button.textContent=original;button.classList.remove("listening")}};
 rec.onerror=e=>{
   finish();
   const msg=e?.error==="not-allowed"?"Permesso microfono negato. Abilitalo in Chrome oppure usa il microfono della tastiera.":"Dettatura non disponibile qui: usa il microfono della tastiera Android.";
   showToast(msg,4200);target.focus();
 };
 rec.onend=finish;
 try{rec.start();showToast("Parla adesso. La dettatura si fermerà automaticamente.",1800)}catch(e){finish();showToast("Apri il file in Chrome per la dettatura diretta, oppure usa il microfono della tastiera.",4200)}
}
