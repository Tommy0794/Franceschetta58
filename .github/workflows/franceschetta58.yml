name: Franceschetta58 - Build APK e pubblica App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Franceschetta58-build-bundle.zip"
      - ".github/workflows/franceschetta58.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "franceschetta58-release"
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Estrai progetto
        run: |
          mkdir -p buildsrc
          unzip -q Franceschetta58-build-bundle.zip -d buildsrc

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila APK
        working-directory: buildsrc/android
        run: gradle assembleDebug

      - name: Prepara APK
        run: |
          mkdir -p dist
          cp buildsrc/android/app/build/outputs/apk/debug/app-debug.apk dist/Franceschetta58-V10.1.apk

      - name: Salva APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: Franceschetta58-V10.1-APK
          path: dist/Franceschetta58-V10.1.apk

      - name: Crea Release scaricabile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v10.1-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/Franceschetta58-V10.1.apk             --title "Franceschetta58 V10.1"             --notes "APK Android installabile di Franceschetta58 V10.1."             --target "$GITHUB_SHA"

  webapp:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Estrai app web
        run: |
          mkdir -p buildsrc
          unzip -q Franceschetta58-build-bundle.zip -d buildsrc

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
